name: Android Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    # secrets cannot be used in step `if:`; map once and test env instead
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Configure release signing
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=android/release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed APK
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: ./gradlew android:assembleRelease --no-daemon

      - name: Stage APK
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: |
          VER=$(grep -oP "appVersionName\s*=\s*'\K[^']+" build.gradle)
          mkdir -p release
          cp android/build/outputs/apk/release/android-release.apk "release/ANDROID-Shattered-Pixel-Dungeon-QoL-${VER}.apk"

      - name: Upload Android artifact
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
