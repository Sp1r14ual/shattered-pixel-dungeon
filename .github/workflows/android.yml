name: Android Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build signed Debug APK
        run: ./gradlew android:assembleDebug --no-daemon

      - name: Stage APK
        run: |
          VER=$(grep -oP "appVersionName\s*=\s*'\K[^']+" build.gradle)
          mkdir -p release
          cp android/build/outputs/apk/debug/android-debug.apk "release/android-shattered-pixel-dungeon-${VER}-debug.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
